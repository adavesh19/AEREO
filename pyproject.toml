[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "geospatial-file-measurement-api"
version = "1.0.0"
description = "FastAPI backend for geospatial file measurements"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations (type hints)
    "S",    # flake8-bandit (security)
    "BLE",  # flake8-blind-except
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",    # Use of assert (common in tests)
    "S603",    # subprocess - not used here
    "ANN401",  # Dynamically typed expressions (Any) - needed for geo data
    "RUF001",  # String contains ambiguous unicode character
    "RUF002",  # Docstring contains ambiguous unicode character
    "RUF003",  # Comment contains ambiguous unicode character
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]  # Relax annotation and security rules in tests

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
log_cli = false
log_level = "WARNING"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
