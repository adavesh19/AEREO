services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: geospatial-api:latest
    container_name: geospatial-api
    ports:
      - "8000:8000"
    volumes:
      # Persist uploads across container restarts
      - uploads_data:/app/uploads
    environment:
      APP_NAME: "Geospatial File Measurement API"
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: 50
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  uploads_data:
    driver: local
